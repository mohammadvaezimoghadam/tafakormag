services:
  db:
    image: postgres:15
    container_name: tafakor_db
    environment:
      POSTGRES_DB: ${DB_NAME:-tafakor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tafakor_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: tafakor_backend
    entrypoint: []
    command: [ "sh", "-c", "python manage.py makemigrations && python manage.py migrate --noinput && python manage.py createcachetable && gunicorn note_platform.wsgi:application --bind 0.0.0.0:8000 --workers 3" ]
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_NAME=${DB_NAME:-tafakor}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_HOST=db
      - DB_PORT=5432
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - KAVENEGAR_SENDER=${KAVENEGAR_SENDER:-}
      - BOT_API_KEY=${BOT_API_KEY:-}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org/bot}
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tafakor_net

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=/
        - VITE_BALE_OTP_BOT_URL=${VITE_BALE_OTP_BOT_URL:-https://ble.ir/tafakor_otp_bot}
    container_name: tafakor_frontend
    profiles:
      - vue
    ports:
      - "${FRONTEND_PORT:-8085}:80" # قابل تغییر از طریق متغیر محیطی FRONTEND_PORT
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - backend
    networks:
      - tafakor_net

  python_frontend:
    build:
      context: ./python_frontend
    container_name: tafakor_python_frontend
    profiles:
      - python
    ports:
      - "${FRONTEND_PORT:-8085}:8080" # مپ کردن پورت یکسان ۸۰۸۵ به پورت ۸۰۸۰ در NiceGUI
    environment:
      - FRONTEND_DEV_PORT=8080
      - BACKEND_API_INTERNAL_URL=http://backend:8000
      - VITE_BALE_OTP_BOT_URL=${VITE_BALE_OTP_BOT_URL:-https://ble.ir/tafakor_otp_bot}
    depends_on:
      - backend
    networks:
      - tafakor_net

  bot_runner:
    build: ./bot_runner
    container_name: tafakor_bot
    environment:
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL:-}
      - BACKEND_API_URL=http://backend:8000/api
      - BOT_API_KEY=${BOT_API_KEY:-}
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-false}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org/bot}
    depends_on:
      - backend
    networks:
      - tafakor_net

  bale_otp_bot:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: tafakor_bale_otp_bot
    entrypoint: []
    command: [ "python", "otp/bale_bot.py" ]
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-tafakor}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_HOST=db
      - DB_PORT=5432
      - BALE_OTP_BOT_TOKEN=${BALE_OTP_BOT_TOKEN:-}
      - BALE_BOT_TOKEN=${BALE_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tafakor_net

  telegram_proxy:
    build: ./telegram_proxy
    container_name: tafakor_telegram_proxy
    environment:
      - GAS_URL=${GAS_URL}
      - RELAY_TOKEN=${RELAY_TOKEN}
      - USE_PROXY_RELAY=${USE_PROXY_RELAY:-false}
      - PROXY_PORT=8080
      - PROXY_HOST=0.0.0.0
    networks:
      - tafakor_net

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  tafakor_net:
    driver: bridge
